<script>
(() => {
  const root = document.getElementById('dayline-design');
  const today = '2026-10-03';
  let nextId = 7;
  const sample = [
    {id:1,title:'캠페인 수정 버그픽스',ticket:'CMGSL-13332',start:'2026-10-01',end:'2026-10-05',comments:[{time:'2026/10/02 14:30',text:'디자이너가 수정페이지 UX 전달. 버튼 위치와 오류 메시지 확인 필요.',link:'https://www.figma.com/design/dayline-example'},{time:'2026/10/03 10:15',text:'저장 실패 케이스 재현 완료. API 응답 처리 수정 예정.'}]},
    {id:2,title:'로그인 리다이렉트 오류',ticket:'CMGSL-13348',start:'2026-10-02',end:'2026-10-06',comments:[{time:'2026/10/02 16:20',text:'로그인 후 원래 페이지로 이동하지 않는 현상 확인.'}]},
    {id:3,title:'검색 필터 상태 유지',ticket:'',start:'2026-10-03',end:'2026-10-07',comments:[]},
    {id:4,title:'리포트 내보내기 개선',ticket:'CMGSL-13401',start:'2026-10-06',end:'2026-10-09',comments:[]},
    {id:5,title:'알림 문구 정리',ticket:'',start:'2026-10-08',end:'2026-10-09',comments:[]},
    {id:6,title:'설정 화면 간격 수정',ticket:'CMGSL-13281',start:'2026-09-28',end:'2026-09-30',comments:[]}
  ];
  const settings = {response:'성공'};
  const states = new Map();
  const popState = {selected:null,filter:'InProgress',query:'',layout:'popover'};
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status = t => today < t.start ? 'ToDo' : today > t.end ? 'Closed' : 'InProgress';
  const statusLabel = s => ({InProgress:'진행 중',ToDo:'예정',Closed:'완료'}[s]);
  const full = date => date ? date.replaceAll('-','/') : '선택';
  const dot = s => `<span class="dl-dot ${s==='ToDo'?'todo':s==='Closed'?'closed':''}" aria-hidden="true"></span>`;
  const count = t => `<span class="dl-comment-count" aria-label="코멘트 ${t.comments.length}개"><i data-lucide="message-circle" aria-hidden="true"></i>${t.comments.length}</span>`;
  const ticketLink = t => t.ticket ? `<a class="dl-ticket cursor-interaction" href="#jira-${encodeURIComponent(t.ticket)}" data-ticket="${esc(t.ticket)}" aria-label="${esc(t.ticket)} Jira 티켓 열기">${esc(t.ticket)}<i data-lucide="arrow-up-right" aria-hidden="true"></i></a>` : '';
  const badge = t => `<span class="dl-status"><span class="dl-dot ${status(t)==='ToDo'?'todo':status(t)==='Closed'?'closed':''}"></span>${statusLabel(status(t))}</span>`;
  const icons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:15,height:15}}); };
  const currentTask = state => sample.find(t => t.id === state.selected) || sample[0];
  const filtered = state => sample.filter(t => (!state.filter || status(t)===state.filter) && `${t.title} ${t.ticket} ${t.comments.map(c => `${c.text} ${c.link || ''}`).join(' ')}`.toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>['InProgress','ToDo','Closed'].indexOf(status(a))-['InProgress','ToDo','Closed'].indexOf(status(b)) || a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || a.title.localeCompare(b.title));
  const filters = state => `<div class="dl-filters" role="tablist" aria-label="작업 상태">${['InProgress','ToDo','Closed'].map(s => `<button type="button" role="tab" id="dl-${state.layout}-${s}-tab" aria-controls="dl-${state.layout}-results" class="dl-filter cursor-interaction" data-filter="${s}" aria-selected="${state.filter===s}">${dot(s)}${statusLabel(s)}</button>`).join('')}</div>`;
  const rows = (tasks,state,popover=false) => tasks.map(t => `<div class="dl-row" data-active="${!popover&&state.selected===t.id}"><button type="button" class="dl-row-hit cursor-interaction" ${popover?'data-pop-task':'data-task'}="${t.id}" aria-label="${esc(t.title)}, 코멘트 ${t.comments.length}개"></button><div class="dl-row-heading"><span class="dl-row-title">${esc(t.title)}</span>${popover?`<button type="button" class="dl-icon cursor-interaction" data-pop-edit="${t.id}" aria-label="${esc(t.title)} 수정" data-tooltip="제목 · 티켓 · 기간 수정" ${t.saving?'disabled':''}><i data-lucide="pencil" aria-hidden="true"></i></button>`:''}</div><div class="dl-row-meta">${ticketLink(t)||'<span>티켓 없음</span>'}${count(t)}</div><div class="dl-row-period">${full(t.start)} — ${full(t.end)}</div></div>`).join('');
  const feedback = t => t?.feedback ? `<div class="dl-feedback" data-error="${Boolean(t.failed)}" role="status">${esc(t.feedback)}${t.failed?'<button type="button" class="dl-button" data-action="retry">재시도</button>':''}</div>` : '';
  function detail(t) {
    if (!t) return '<div class="dl-empty">목록에서 작업을 선택하세요.</div>';
    return `<div class="dl-detail-head"><div class="dl-title-line"><h3>${esc(t.title)}</h3>${count(t)}</div><div class="dl-detail-actions"><button class="dl-icon cursor-interaction" data-action="edit" ${t.saving?'disabled':''} type="button" aria-label="작업 수정" data-tooltip="제목 · 티켓 · 기간 수정"><i data-lucide="pencil" aria-hidden="true"></i></button><button class="dl-icon cursor-interaction" data-action="delete" type="button" aria-label="작업 삭제"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div>
      <div class="dl-metadata">${t.ticket?ticketLink(t):'<span>티켓 없음</span>'}${badge(t)}<span class="dl-date-range">${full(t.start)} — ${full(t.end)}</span></div>
      ${feedback(t)}
      ${t.comments.length?t.comments.map(c => `<div class="dl-comment"><time>${esc(c.time)}</time><p>${esc(c.text)}</p>${c.link?`<p><a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">링크 열기</a></p>`:''}</div>`).join(''):'<p class="dl-help">남긴 메모가 여기에 쌓입니다.</p>'}
      <div class="dl-composer"><textarea name="comment" aria-label="작업 메모 입력" rows="2" placeholder="작업 메모나 링크를 남기세요." ${t.saving?'disabled':''}></textarea><div class="dl-comment-actions"><span class="dl-sync">${t.ticket?'모의 Jira 연동':'로컬에만 저장'}</span><button type="button" class="dl-button cursor-interaction" data-action="comment" ${t.saving?'disabled':''}>추가</button></div></div><div class="dl-inline-result" data-comment-result aria-live="polite"></div>`;
  }
  function render(win) {
    const state = states.get(win);
    const tasks = filtered(state);
    if (!tasks.some(t=>t.id===state.selected)) state.selected=tasks[0]?.id;
    const content = win.querySelector('.dl-content');
    if (win.dataset.layout==='split') {
      content.innerHTML = `<div class="dl-split"><div class="dl-list">${filters(state)}<div role="tabpanel" id="dl-split-results" aria-labelledby="dl-split-${state.filter}-tab">${rows(tasks,state) || '<div class="dl-empty">이 상태에 해당하는 작업이 없습니다.</div>'}</div></div><div class="dl-detail">${detail(tasks.find(t=>t.id===state.selected))}</div></div>`;
    } else {
      content.innerHTML = `<div class="dl-table-wrap">${filters(state)}${feedback(tasks.find(t=>t.id===state.selected))}<div role="tabpanel" id="dl-table-results" aria-labelledby="dl-table-${state.filter}-tab">${rows(tasks,state)||'<div class="dl-empty">이 상태에 해당하는 작업이 없습니다.</div>'}</div></div>`;
    }
    icons();
  }
  function renderAll() {
    root.querySelectorAll('.dl-window').forEach(render);
    renderPopover();
    icons();
  }
  function renderPopover() {
    root.querySelector('[data-popover-body]').innerHTML=filters(popState)+`<div role="tabpanel" id="dl-popover-results" aria-labelledby="dl-popover-${popState.filter}-tab">${rows(filtered(popState),popState,true)||'<div class="dl-empty">이 상태에 해당하는 작업이 없습니다.</div>'}</div>`;
    icons();
  }
  function showDetailSheet(win) {
    const overlay = win.querySelector('[data-overlay]');
    overlay.innerHTML = `<div class="dl-sheet wide" role="dialog" aria-modal="true" aria-label="작업 상세"><div class="dl-sheet-title"><span>작업 상세</span><button class="dl-icon cursor-interaction" type="button" data-action="close" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="dl-detail" style="padding:0">${detail(currentTask(states.get(win)))}</div></div>`;
    overlay.hidden=false; icons();
  }
  function openForm(win, editing) {
    const state=states.get(win), t=editing?currentTask(state):null;
    state.form={id:t?.id || null,start:t?.start || '',end:t?.end || '',year:2026,month:9,savedId:null,busy:false};
    if (t) {state.form.year=Number(t.start.slice(0,4));state.form.month=Number(t.start.slice(5,7))-1;}
    const overlay=win.querySelector('[data-overlay]');
    overlay.innerHTML=`<form class="dl-sheet" role="dialog" aria-modal="true" aria-label="${editing?'작업 수정':'새 작업'}" novalidate><div class="dl-sheet-title"><h3>${editing?'작업 수정':'새 작업'}</h3><button class="dl-icon cursor-interaction" type="button" data-action="close" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></div><label class="dl-field"><span class="dl-field-name">제목</span><input class="dl-input" name="title" placeholder="작업 제목" value="${esc(t?.title || '')}" required autocomplete="off"></label><label class="dl-field"><span class="dl-field-name">Jira 티켓<span class="dl-optional">선택</span></span><input class="dl-input" name="ticket" placeholder="예: CMGSL-13332" value="${esc(t?.ticket || '')}" autocomplete="off"></label><span class="dl-field-name">작업 기간</span><div data-dates></div><p class="dl-help">종료일 당일까지 진행 중으로 표시됩니다.</p><div class="dl-inline-result" data-form-result aria-live="polite"></div><div class="dl-sheet-footer"><button type="button" class="dl-button cursor-interaction" data-action="close">취소</button><button type="button" class="dl-button primary cursor-interaction" data-action="save" data-save disabled>저장</button></div></form>`;
    overlay.hidden=false;
    overlay.querySelector('form').addEventListener('submit', e=>{e.preventDefault();saveForm(win);});

    win.scrollIntoView({behavior:'auto',block:'start'});
    if(!states.get(win).creation?.busy)openCreation(win);

  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{}});tweak.addSelect(settings,'response',{label:'모의 Jira 응답',options:['성공','실패']});}
})();
